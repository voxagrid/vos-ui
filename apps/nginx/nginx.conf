user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured Access Log Format with Timing Metrics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance & Socket Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # OWASP A05: Security Hardening - Suppress Nginx Server Version
    server_tokens off;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Request Buffer & Body Limits (Protection against Buffer Overflow & Large Floods)
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # OWASP A04 / A05: Layer-7 Rate Limiting & Connection Throttling Zones
    # 10MB zone stores ~160,000 active IP states
    limit_req_zone $binary_remote_addr zone=vos_auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=vos_api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=vos_general_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=vos_conn_limit:10m;

    # Include Virtual Host & Server Configurations
    include /etc/nginx/conf.d/*.conf;
}
