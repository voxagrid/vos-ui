# ==============================================================================
# VOS-UI Web Management & Reverse Proxy Gateway
# Standardized Nginx Server Configuration (OWASP Top 10 Hardened)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Global Connection Limit (Max 30 parallel connections per client IP)
    limit_conn vos_conn_limit 30;
    limit_conn_status 429;
    limit_req_status 429;

    # OWASP A05: Universal Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 1. ACME HTTP-01 Challenge Endpoint (Automated Let's Encrypt Issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 2. Health Check Proxy (Used by Docker healthcheck & Load Balancers)
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 3. High-Security Rate-Limited Auth API (Brute-Force & Credential Stuffing Guard)
    location = /api/v1/auth/login {
        limit_req zone=vos_auth_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 4. Go Middleware REST API Reverse Proxy (Port 8080)
    location /api/ {
        limit_req zone=vos_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 5. Realtime WebSocket Proxy (Current Calls, Broadcast & Telemetry)
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 6. Static Web Assets Caching (Fingerprinted assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 7. Disable Cache for index.html (SPA Hot Update Guard)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 8. Single Page Application (SPA) Fallback Route
    location / {
        limit_req zone=vos_general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Standard Error Pages
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"success":false,"code":429,"error_code":"RATE_LIMIT_EXCEEDED","message":"Terlalu banyak permintaan. Harap perlambat laju request Anda."}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
